<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FINCORE - Módulo de Operaciones</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #ebf1f5;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background-color: #ffffff;
            width: 100%;
            max-width: 440px;
            padding: 35px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            margin: 20px;
        }

        .title {
            color: #003366;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            margin-top: 0;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .title-divider {
            height: 2px;
            background-color: #0052cc;
            width: 85%;
            margin: 0 auto 25px auto;
        }

        .saldo-box {
            background-color: #f4f7fa;
            border: 1px solid #dcdfe4;
            border-left: 4px solid #0052cc;
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .saldo-box h3 {
            margin: 0;
            font-size: 11px;
            color: #555;
            text-transform: uppercase;
            font-weight: bold;
        }

        .saldo-box p {
            margin: 4px 0 0 0;
            font-size: 22px;
            font-weight: bold;
            color: #003366;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #333333;
            margin-bottom: 6px;
        }

        label span {
            color: #d93025;
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            font-size: 14px;
            border: 1px solid #c2c7d0;
            border-radius: 6px;
            background-color: #ffffff;
            color: #333333;
            outline: none;
            transition: border-color 0.2s;
        }

        input::placeholder {
            color: #a0a5b1;
        }

        input:focus, select:focus {
            border-color: #0052cc;
        }

        .btn-submit {
            width: 100%;
            background-color: #0052cc;
            color: #ffffff;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #003d99;
        }

        .btn-submit:disabled {
            background-color: #a5b7d6;
            cursor: not-allowed;
        }

        .alert-danger {
            background-color: #fce8e6;
            border: 1px solid #fad2cf;
            color: #d93025;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            margin-top: 15px;
            display: none;
        }

        .alert-success {
            background-color: #e6f4ea;
            border: 1px solid #ceead6;
            color: #137333;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="title">FINCORE</div>
    <div class="title-divider"></div>

    <div class="saldo-box">
        <h3>Saldo Disponible</h3>
        <p>$<span id="saldoTexto">300.00</span> USD</p>
    </div>

    <form id="bancoForm">
        <div class="form-group">
            <label>Tipo de Operación: <span>*</span></label>
            <select id="tipoOperacion" required>
                <option value="">Seleccione una opción...</option>
                <option value="RETIRO">Retiro</option>
                <option value="TRANSFERENCIA">Transferencia</option>
                <option value="DEPOSITO">Depósito</option>
            </select>
        </div>

        <div class="form-group">
            <label>Nombre del Titular: <span>*</span></label>
            <input type="text" id="nombre" placeholder="Nombre y Apellido" required>
        </div>

        <div class="form-group">
            <label>DUI: <span>*</span></label>
            <input type="text" id="dui" placeholder="00000000-0" maxlength="10" required>
        </div>

        <div class="form-group">
            <label>Monto ($): <span>*</span></label>
            <input type="number" id="monto" step="0.01" placeholder="0.00" required>
        </div>

        <button type="submit" id="btnProcesar" class="btn-submit">Procesar Transacción</button>
    </form>

    <div class="alert-danger" id="mensajeError"></div>
    <div class="alert-success" id="mensajeExito">
        ✓ Transacción realizada correctamente.
    </div>
</div>

<script>
    let saldoActual = 300.00;

    const tipoOperacion = document.getElementById('tipoOperacion');
    const nombre = document.getElementById('nombre');
    const dui = document.getElementById('dui');
    const monto = document.getElementById('monto');
    const mensajeError = document.getElementById('mensajeError');
    const mensajeExito = document.getElementById('mensajeExito');

    dui.addEventListener('input', (e) => {
        let val = e.target.value.replace(/\D/g, '');
        if (val.length > 8) {
            val = val.substring(0, 8) + '-' + val.substring(8, 9);
        }
        e.target.value = val;
    });

    document.getElementById('bancoForm').addEventListener('submit', (e) => {
        e.preventDefault();

        // Ocultar alertas previas
        mensajeError.style.display = 'none';
        mensajeExito.style.display = 'none';

        const valMonto = parseFloat(monto.value);
        const tipo = tipoOperacion.value;

        if (isNaN(valMonto) || valMonto <= 0) {
            mensajeError.innerText = " Ingrese un monto mayor a $0.00 USD.";
            mensajeError.style.display = 'block';
            return;
        }

        if ((tipo === 'RETIRO' || tipo === 'TRANSFERENCIA') && valMonto > saldoActual) {
            mensajeError.innerText = "FONDOS INSUFICIENTES";
            mensajeError.style.display = 'block';
            return; 
        }

        if (tipo === 'DEPOSITO') {
            saldoActual += valMonto;
        } else {
            saldoActual -= valMonto;
        }

        document.getElementById('saldoTexto').innerText = saldoActual.toFixed(2);

        mensajeExito.style.display = 'block';
        setTimeout(() => { mensajeExito.style.display = 'none'; }, 4000);

        document.getElementById('bancoForm').reset();
    });
</script>

</body>
</html>
